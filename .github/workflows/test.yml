name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version
          gh --version | head -1
          shellcheck --version | head -2

      - name: Shell syntax check
        run: bash -n gh-pr-enrich

      - name: Lint shell scripts
        run: shellcheck -S error gh-pr-enrich tests/*.sh tests/lib/*.sh

      # Runs every suite, including any suite added later. Individual suites are
      # not listed here so a new test file cannot be silently left out of CI.
      - name: Test suites
        run: tests/run-all.sh
